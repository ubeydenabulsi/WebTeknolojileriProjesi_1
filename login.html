    <main class="container mt-5">
    <h1>Öğrenci Giriş Sistemi</h1>
    <hr>
    
    <form id="loginForm" action="login.php" method="POST" onsubmit="return kontrolEt()">
        
        <div class="mb-3">
            <label for="email" class="form-label">Öğrenci E-posta Adresi:</label>
            <input type="text" id="email" name="kullanici_mail" class="form-control" placeholder="örn: b2412100001@sakarya.edu.tr">
        </div>

        <div class="mb-3">
            <label for="sifre" class="form-label">Şifre (Öğrenci Numaranız):</label>
            <input type="password" id="sifre" name="kullanici_sifre" class="form-control" placeholder="örn: b2412100001">
        </div>

        <button type="submit" class="btn btn-primary">Giriş Yap</button>
        
    </form>
    </main>

<script>
    function kontrolEt() {
        let mail = document.getElementById("email").value;
        let sifre = document.getElementById("sifre").value;

      
        if (mail == "" || sifre == "") {
            alert("Lütfen e-posta ve şifre alanını boş bırakmayın!");
            return false;
        }

      
        if (mail.indexOf("@") == -1) {
            alert("E-posta adresinizi doğru yazdığınızdan emin olun!");
            return false;
        }

        return true; 
    }
</script>
